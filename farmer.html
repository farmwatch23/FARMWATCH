<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farmers: Register or log in | FarmWatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--tomato:#E8412F;--sun:#FFC72C;--leaf:#16894A;--deep:#0E3B2B;--mint:#D9F2D0;--white:#fff;
--head:'Bricolage Grotesque','Trebuchet MS',sans-serif;--body:'Figtree','Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);color:var(--deep);background:var(--sun);line-height:1.6;font-size:1.05rem;min-height:100vh}
a{color:inherit}
:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 1.25rem}
.nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 0}
.logo{font-family:var(--head);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;text-decoration:none}
.logo span{color:var(--tomato)} 
.back{font-weight:600;text-decoration:none;padding:.5rem .9rem;border-radius:999px}
.back:hover{background:rgba(255,255,255,.5)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center;padding:2rem 0 4rem}
h1{font-family:var(--head);font-weight:800;font-size:clamp(2.4rem,5.5vw,4.2rem);line-height:1;letter-spacing:-.035em}
.lead{margin:1.2rem 0 1.8rem;font-size:1.2rem;max-width:32rem}
.perks{list-style:none;display:grid;gap:.7rem}
.perks li{background:var(--white);border:3px solid var(--deep);border-radius:18px;padding:.8rem 1.1rem;font-weight:600}
.card{background:var(--white);border:3px solid var(--deep);border-radius:28px;padding:1.6rem;box-shadow:10px 10px 0 var(--tomato)}
.tabs{display:flex;gap:.5rem;margin-bottom:1.3rem}
.tab{flex:1;font:inherit;font-weight:600;padding:.7rem;border:3px solid var(--deep);border-radius:999px;background:var(--white);color:var(--deep);cursor:pointer}
.tab[aria-selected="true"]{background:var(--deep);color:var(--white)}
form{display:grid;gap:.9rem}
label{font-weight:600;display:grid;gap:.3rem}
input{font:inherit;padding:.75rem 1rem;border:3px solid var(--deep);border-radius:14px;color:var(--deep);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.btn{font:inherit;font-weight:600;padding:.9rem 1.5rem;border-radius:999px;border:3px solid var(--deep);background:var(--tomato);color:var(--white);cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.msg{min-height:1.5rem;font-weight:600;color:#B3261E}
.msg.ok{color:var(--leaf)}
[hidden]{display:none!important}
@media (max-width:820px){.grid{grid-template-columns:1fr;gap:2rem}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav" aria-label="Main">
    <a class="logo" href="index.html">Farm<span>Watch</span></a>
    <a class="back" href="index.html">Back to marketplace</a>
  </nav>

  <div class="grid">
    <div>
      <h1>Sell your harvest directly.</h1>
      <p class="lead">Create a free farmer account, list your crops, and let customers order from you with no middlemen.</p>
      <ul class="perks">
        <li>Set your own prices</li>
        <li>Update stock in seconds</li>
        <li>Reach customers near you</li>
      </ul>
    </div>

    <div class="card">
      <div class="tabs" role="tablist">
        <button class="tab" id="tab-reg" role="tab" aria-selected="true">Register</button>
        <button class="tab" id="tab-log" role="tab" aria-selected="false">Log in</button>
      </div>

      <form id="regForm">
        <label>Full name<input id="rName" autocomplete="name" required></label>
        <div class="two">
          <label>Phone number<input id="rPhone" type="tel" autocomplete="tel" required></label>
          <label>Village or town<input id="rPlace" required></label>
        </div>
        <label>Email<input id="rEmail" type="email" autocomplete="email" required></label>
        <label>Password (6+ characters)<input id="rPass" type="password" autocomplete="new-password" minlength="6" required></label>
        <button class="btn" id="rBtn">Create farmer account</button>
      </form>

      <form id="logForm" hidden>
        <label>Email<input id="lEmail" type="email" autocomplete="email" required></label>
        <label>Password<input id="lPass" type="password" autocomplete="current-password" required></label>
        <button class="btn" id="lBtn">Log in</button>
      </form>

      <p class="msg" id="msg" role="alert"></p>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAzEciHKeJzZmihMWsZVYvh4jNz-OrspVA",
    authDomain: "farm-watch-50535.firebaseapp.com",
    projectId: "farm-watch-50535",
    storageBucket: "farm-watch-50535.firebasestorage.app",
    messagingSenderId: "695242174342",
    appId: "1:695242174342:web:5bf655f5096acaa3b14607",
    measurementId: "G-731TSKEK9W"
};

const DASHBOARD = "dashboard.html";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
let busy = false;

function show(text, ok) { $("msg").textContent = text; $("msg").className = "msg" + (ok ? " ok" : ""); }

function friendly(err) {
  const m = {
    "auth/email-already-in-use": "This email already has an account. Try logging in.",
    "auth/invalid-email": "That email address does not look right.",
    "auth/weak-password": "Use a password with at least 6 characters.",
    "auth/invalid-credential": "Wrong email or password.",
    "auth/too-many-requests": "Too many attempts. Wait a few minutes and try again.",
    "auth/network-request-failed": "No internet connection. Check it and try again."
  };
  return m[err.code] || "Something went wrong. Please try again.";
}

function pick(which) {
  const reg = which === "reg";
  $("regForm").hidden = !reg; $("logForm").hidden = reg;
  $("tab-reg").setAttribute("aria-selected", reg); $("tab-log").setAttribute("aria-selected", !reg);
  show("");
}
$("tab-reg").onclick = () => pick("reg");
$("tab-log").onclick = () => pick("log");

$("regForm").addEventListener("submit", async e => {
  e.preventDefault(); busy = true; $("rBtn").disabled = true; show("Creating your account…", true);
  try {
    const cred = await createUserWithEmailAndPassword(auth, $("rEmail").value.trim(), $("rPass").value);
    await set(ref(db, "farmers/" + cred.user.uid), {
      name: $("rName").value.trim(),
      phone: $("rPhone").value.trim(),
      place: $("rPlace").value.trim(),
      email: $("rEmail").value.trim(),
      role: "farmer",
      createdAt: Date.now()
    });
    show("Account created. Taking you to your dashboard…", true);
    location.href = DASHBOARD;
  } catch (err) { show(friendly(err)); busy = false; $("rBtn").disabled = false; }
});

$("logForm").addEventListener("submit", async e => {
  e.preventDefault(); busy = true; $("lBtn").disabled = true; show("Logging in…", true);
  try {
    const cred = await signInWithEmailAndPassword(auth, $("lEmail").value.trim(), $("lPass").value);
    const snap = await get(ref(db, "farmers/" + cred.user.uid));
    if (!snap.exists()) {
      await signOut(auth);
      show("This is not a farmer account. Customers log in on the customer page.");
      busy = false; $("lBtn").disabled = false; return;
    }
    location.href = DASHBOARD;
  } catch (err) { show(friendly(err)); busy = false; $("lBtn").disabled = false; }
});

// Already logged in as a farmer? Skip straight to the dashboard.
onAuthStateChanged(auth, async user => {
  if (!user || busy) return;
  try { if ((await get(ref(db, "farmers/" + user.uid))).exists()) location.href = DASHBOARD; } catch (e) {}
});
</script>
</body>
</html>
