<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farmer dashboard | FarmWatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--tomato:#E8412F;--sun:#FFC72C;--leaf:#16894A;--deep:#0E3B2B;--mint:#D9F2D0;--white:#fff;
--head:'Bricolage Grotesque','Trebuchet MS',sans-serif;--body:'Figtree','Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);color:var(--deep);background:var(--white);line-height:1.6;font-size:1.05rem}
a{color:inherit}
:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 1.25rem}
.top{background:var(--sun);border-radius:0 0 40px 40px;padding-bottom:2.6rem}
.nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 0;flex-wrap:wrap}
.logo{font-family:var(--head);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;text-decoration:none}
.logo span{color:var(--tomato)}
.nav-r{display:flex;gap:.6rem;align-items:center}
.nav-r a{font-weight:600;text-decoration:none;padding:.5rem .9rem;border-radius:999px}
.nav-r a:hover{background:rgba(255,255,255,.5)}
h1{font-family:var(--head);font-weight:800;font-size:clamp(2rem,5vw,3.4rem);line-height:1.05;letter-spacing:-.03em;margin-top:1rem}
.sub{margin-top:.6rem;font-size:1.15rem}
.stats{display:flex;gap:.8rem;margin-top:1.4rem;flex-wrap:wrap}
.stat{background:var(--white);border:3px solid var(--deep);border-radius:18px;padding:.6rem 1.1rem;font-weight:600}
.stat b{font-family:var(--head);font-size:1.5rem;margin-right:.3rem}
.layout{display:grid;grid-template-columns:380px 1fr;gap:1.6rem;padding:2.4rem 0 4rem;align-items:start}
.panel{border:3px solid var(--deep);border-radius:28px;padding:1.5rem}
.panel.form{background:var(--mint);position:sticky;top:1rem}
h2{font-family:var(--head);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;margin-bottom:1rem}
form{display:grid;gap:.9rem}
label{font-weight:600;display:grid;gap:.3rem}
input,select{font:inherit;padding:.7rem 1rem;border:3px solid var(--deep);border-radius:14px;color:var(--deep);background:var(--white);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.btn{font:inherit;font-weight:600;padding:.8rem 1.4rem;border-radius:999px;border:3px solid var(--deep);background:var(--tomato);color:var(--white);cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.ghost{background:var(--white);color:var(--deep)}
.btn.small{padding:.4rem .9rem;font-size:.95rem}
.msg{min-height:1.4rem;font-weight:600;color:#B3261E;margin-top:.6rem}
.msg.ok{color:var(--leaf)}
.list{display:grid;gap:1rem}
.crop{border:3px solid var(--deep);border-radius:22px;padding:1.1rem 1.3rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.crop:nth-child(4n+1){background:#FFEFB8}.crop:nth-child(4n+2){background:#FFD9D3}
.crop:nth-child(4n+3){background:#CFE6FF}.crop:nth-child(4n+4){background:var(--mint)}
.crop h3{font-family:var(--head);font-size:1.4rem;line-height:1.1}
.crop .meta{opacity:.8}
.crop .price{font-family:var(--head);font-weight:800;font-size:1.3rem}
.acts{display:flex;gap:.5rem}
.empty{border:3px dashed var(--deep);border-radius:22px;padding:1.5rem;font-weight:600}
[hidden]{display:none!important}
@media (max-width:860px){.layout{grid-template-columns:1fr}.panel.form{position:static}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <nav class="nav" aria-label="Main">
      <a class="logo" href="index.html">Farm<span>Watch</span></a>
      <div class="nav-r">
        <a href="index.html">View marketplace</a>
        <button class="btn ghost small" id="logout">Log out</button>
      </div>
    </nav>
    <h1 id="hello">Your dashboard</h1>
    <p class="sub">Add your crops here. They show up on the marketplace right away.</p>
    <div class="stats"><div class="stat"><b id="statCount">0</b>crops listed</div></div>
  </div>
</header>

<main class="wrap layout">
  <section class="panel form" aria-labelledby="formTitle">
    <h2 id="formTitle">Add a crop</h2>
    <form id="cropForm">
      <label>Crop name<input id="cName" placeholder="Tomatoes" required></label>
      <div class="two">
        <label>Price (₹)<input id="cPrice" type="number" min="0" step="0.01" required></label>
        <label>Unit
          <select id="cUnit"><option>kg</option><option>quintal</option><option>dozen</option><option>piece</option><option>litre</option></select>
        </label>
      </div>
      <label>Quantity available<input id="cQty" type="number" min="0" step="0.1" required></label>
      <button class="btn" id="saveBtn">Add crop</button>
      <button class="btn ghost" type="button" id="cancelBtn" hidden>Cancel editing</button>
    </form>
    <p class="msg" id="msg" role="alert"></p>
  </section>

  <section aria-labelledby="listTitle">
    <h2 id="listTitle">Your listings</h2>
    <div class="list" id="list"><p class="empty">Loading…</p></div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, addDoc, updateDoc, deleteDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAzEciHKeJzZmihMWsZVYvh4jNz-OrspVA",
    authDomain: "farm-watch-50535.firebaseapp.com",
    projectId: "farm-watch-50535",
    storageBucket: "farm-watch-50535.firebasestorage.app",
    messagingSenderId: "695242174342",
    appId: "1:695242174342:web:5bf655f5096acaa3b14607",
    measurementId: "G-731TSKEK9W"
};
const LOGIN_PAGE = "farmer.html";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

let me = null, crops = {}, editingId = null;

function show(text, ok) { $("msg").textContent = text; $("msg").className = "msg" + (ok ? " ok" : ""); }

function resetForm() {
  editingId = null;
  $("cropForm").reset();
  $("formTitle").textContent = "Add a crop";
  $("saveBtn").textContent = "Add crop";
  $("cancelBtn").hidden = true;
}

onAuthStateChanged(auth, async user => {
  if (!user) { location.href = LOGIN_PAGE; return; }
  try {
    const snap = await getDoc(doc(db, "farmers", user.uid));
    if (!snap.exists()) { await signOut(auth); location.href = LOGIN_PAGE; return; }
    const f = snap.data();
    me = { uid: user.uid, name: f.name || "Farmer", place: f.place || "" };
    $("hello").textContent = "Hello, " + me.name.split(" ")[0];
    listen();
  } catch (e) { $("list").innerHTML = '<p class="empty">Could not load your account. Check your connection and refresh.</p>'; }
});

function listen() {
  const q = query(collection(db, "crops"), where("farmerId", "==", me.uid));
  onSnapshot(q, snap => {
    crops = {};
    snap.forEach(d => { crops[d.id] = d.data(); });
    render();
  }, () => { $("list").innerHTML = '<p class="empty">Could not load your crops. Check your Firestore rules.</p>'; });
}

function render() {
  const items = Object.entries(crops).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
  $("statCount").textContent = items.length;
  $("list").innerHTML = items.length ? items.map(([id, c]) => `
    <article class="crop">
      <div>
        <h3>${esc(c.name)}</h3>
        <div class="price">₹${esc(c.price)}/${esc(c.unit)}</div>
        <div class="meta">${esc(c.quantity)} ${esc(c.unit)} available</div>
      </div>
      <div class="acts">
        <button class="btn ghost small" data-act="edit" data-id="${esc(id)}">Edit</button>
        <button class="btn small" data-act="del" data-id="${esc(id)}">Delete</button>
      </div>
    </article>`).join("")
    : '<p class="empty">No crops yet. Add your first crop using the form.</p>';
}

$("list").addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const id = b.dataset.id, c = crops[id]; if (!c) return;
  if (b.dataset.act === "edit") {
    editingId = id;
    $("cName").value = c.name; $("cPrice").value = c.price; $("cUnit").value = c.unit; $("cQty").value = c.quantity;
    $("formTitle").textContent = "Edit crop";
    $("saveBtn").textContent = "Save changes";
    $("cancelBtn").hidden = false;
    show("");
    $("cName").focus();
  } else if (confirm("Delete " + c.name + " from the marketplace?")) {
    try { await deleteDoc(doc(db, "crops", id)); if (editingId === id) resetForm(); show("Crop deleted.", true); }
    catch (err) { show("Could not delete. Please try again."); }
  }
});

$("cancelBtn").onclick = () => { resetForm(); show(""); };

$("cropForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!me) return;
  $("saveBtn").disabled = true;
  const fields = {
    name: $("cName").value.trim(),
    price: Number($("cPrice").value),
    unit: $("cUnit").value,
    quantity: Number($("cQty").value),
    updatedAt: Date.now()
  };
  try {
    if (editingId) {
      await updateDoc(doc(db, "crops", editingId), fields);
      show("Changes saved.", true);
    } else {
      await addDoc(collection(db, "crops"), { ...fields, farmerId: me.uid, farmerName: me.name, location: me.place, createdAt: Date.now() });
      show("Crop added. It is now on the marketplace.", true);
    }
    resetForm();
  } catch (err) { show("Could not save. Check your connection and try again."); }
  $("saveBtn").disabled = false;
});

$("logout").onclick = async () => { await signOut(auth); location.href = "index.html"; };
</script>
</body>
</html>
